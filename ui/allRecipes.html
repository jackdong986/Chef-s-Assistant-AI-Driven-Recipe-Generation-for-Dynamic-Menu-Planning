<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Recipes</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            color: #333;
            padding: 20px;
        }
        h1 {
            color: #00509E;
        }
        .filters {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .filter {
            margin: 5px;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            background-color: #f1f1f1;
        }
        .filter:hover {
            background-color: #e0e0e0;
        }
        .recipe-item {
            padding: 15px;
            border: 1px solid #ddd;
            margin-bottom: 10px;
            border-radius: 5px;
            background-color: #fff;
        }
        .recipe-item:hover {
            background-color: #f1f1f1;
        }
        .pagination {
            margin-top: 20px;
            text-align: center;
        }
        .pagination button {
            padding: 10px 15px;
            margin: 0 5px;
            border: none;
            background-color: #00509E;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        .pagination button:hover {
            background-color: #003d7e;
        }
        .pagination button[disabled] {
            background-color: #ddd;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>All Recipes</h1>
    <!-- Alphabet Filters -->
    <div class="filters" id="alphabetFilters">
        <span class="filter" onclick="fetchFilteredRecipes('letter', 'a', 2, event)">A</span>
    <span class="filter" onclick="fetchFilteredRecipes('letter', 'b', 2, event)">B</span>
    <span class="filter" onclick="fetchFilteredRecipes('letter', 'c', 1, event)">C</span>
    <span class="filter" onclick="fetchFilteredRecipes('letter', 'd', 1, event)">D</span>
    <span class="filter" onclick="fetchFilteredRecipes('letter', 'e', 1, event)">E</span>
    <span class="filter" onclick="fetchFilteredRecipes('letter', 'f', 1, event)">F</span>
    <span class="filter" onclick="fetchFilteredRecipes('letter', 'g', 1, event)">G</span>
    <span class="filter" onclick="fetchFilteredRecipes('letter', 'h', 1, event)">H</span>
    <span class="filter" onclick="fetchFilteredRecipes('letter', 'i', 1, event)">I</span>
    <span class="filter" onclick="fetchFilteredRecipes('letter', 'j', 1, event)">J</span>
    <span class="filter" onclick="fetchFilteredRecipes('letter', 'k', 1, event)">K</span>
    <span class="filter" onclick="fetchFilteredRecipes('letter', 'l', 1, event)">L</span>
    <span class="filter" onclick="fetchFilteredRecipes('letter', 'm', 1, event)">M</span>
    <span class="filter" onclick="fetchFilteredRecipes('letter', 'n', 1, event)">N</span>
    <span class="filter" onclick="fetchFilteredRecipes('letter', 'o', 1, event)">O</span>
    <span class="filter" onclick="fetchFilteredRecipes('letter', 'p', 2, event)">P</span>
    <span class="filter" onclick="fetchFilteredRecipes('letter', 'q', 1, event)">Q</span>
    <span class="filter" onclick="fetchFilteredRecipes('letter', 'r', 1, event)">R</span>
    <span class="filter" onclick="fetchFilteredRecipes('letter', 's', 1, event)">S</span>
    <span class="filter" onclick="fetchFilteredRecipes('letter', 't', 2, event)">T</span>
    <span class="filter" onclick="fetchFilteredRecipes('letter', 'u', 1, event)">U</span>
    <span class="filter" onclick="fetchFilteredRecipes('letter', 'v', 1, event)">V</span>
    <span class="filter" onclick="fetchFilteredRecipes('letter', 'w', 1, event)">W</span>
    <span class="filter" onclick="fetchFilteredRecipes('letter', 'x', 1, event)">X</span>
    <span class="filter" onclick="fetchFilteredRecipes('letter', 'y', 1, event)">Y</span>
    <span class="filter" onclick="fetchFilteredRecipes('letter', 'z', 1, event)">Z</span>
    </div>

    <!-- Category Filters -->
    <div class="filters">
        <span class="filter" onclick="fetchFilteredRecipes('category', 'chinese', 1)">Chinese</span>
        <span class="filter" onclick="fetchFilteredRecipes('category', 'western', 1)">Western</span>
        <span class="filter" onclick="fetchFilteredRecipes('category', 'other', 1)">Other</span>
    </div>

    <div id="recipeList"></div>

    <div class="pagination">
        <button id="prevPage" onclick="changePage(-1)" disabled>Previous</button>
        <span id="pageIndicator">Page 1</span>
        <button id="nextPage" onclick="changePage(1)" disabled>Next</button>
    </div>

    <script>
        let currentPage = 1;
        let currentFilterType = 'letter'; // Default filter is by letter
        let currentFilterValue = 'a'; // Default filter value is 'a'

        // Automatically fetch recipes for "A" letter filter on page load
        window.onload = function() {
            fetchFilteredRecipes('letter', 'a', 1);
        };

        function fetchFilteredRecipes(type, value, page) {
            currentFilterType = type;
            currentFilterValue = value;
            currentPage = page;

            const url = `/filtered_recipes?${type}=${value}&page=${page}`;
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const recipeList = document.getElementById('recipeList');
                    const prevPage = document.getElementById('prevPage');
                    const nextPage = document.getElementById('nextPage');
                    const pageIndicator = document.getElementById('pageIndicator');

                    recipeList.innerHTML = '';
                    if (data.error) {
                        recipeList.innerHTML = `<p>${data.error}</p>`;
                        prevPage.disabled = true;
                        nextPage.disabled = true;
                        return;
                    }

                    // Display the recipes
                    recipeList.innerHTML = data.recipes.map(recipe => `
                        <div class="recipe-item">
                            <h2>${recipe.name}</h2>
                            <p><strong>Description:</strong> ${recipe.description}</p>
                            <p><strong>Ingredients:</strong></p>
                            <ul>${recipe.ingredients.map(item => `<li>${item}</li>`).join('')}</ul>
                            <p><strong>Steps:</strong></p>
                            <ol>${recipe.steps.map(step => `<li>${step}</li>`).join('')}</ol>
                        </div>
                    `).join('');

                    // Handle pagination
                    pageIndicator.innerText = `Page ${data.current_page} of ${data.total_pages}`;
                    prevPage.disabled = data.current_page === 1;
                    nextPage.disabled = data.current_page === data.total_pages;
                })
                .catch(error => console.error('Error fetching filtered recipes:', error));
        }

        function changePage(direction) {
            fetchFilteredRecipes(currentFilterType, currentFilterValue, currentPage + direction);
        }
    </script>
</body>
</html>
