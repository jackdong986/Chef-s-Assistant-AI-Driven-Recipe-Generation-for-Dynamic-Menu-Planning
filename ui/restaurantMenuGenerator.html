<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Menu Generator</title>
    <style>
        /* CSS styles here */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 50%;
            margin: auto;
            overflow: hidden;
            padding: 20px;
            background: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            margin-top: 50px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin: 10px 0 5px;
            color: #555;
        }
        input[type="text"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        input[type="submit"] {
            background: #28a745;
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        input[type="submit"]:hover {
            background: #218838;
        }
        h2 {
            color: #333;
        }
        .menu-item, .random-recipe {
            background: #e9ecef;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
        .button {
            background: #007bff;
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .button:hover {
            background: #0056b3;
        }
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            z-index: 1000;
        }
        .popup h2 {
            margin: 0;
        }
        .popup input[type="button"] {
            background: #28a745;
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .popup input[type="button"]:hover {
            background: #218838;
        }
        .popup .close {
            background: #dc3545;
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .popup .close:hover {
            background: #c82333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Restaurant Menu Generator</h1>
        <form method="post" action="/">
            <label for="prompt">Enter your food:</label>
            <input type="text" id="prompt" name="prompt" required>
            
            <label for="dietary_restrictions">Dietary Restrictions:</label>
            <input type="text" id="dietary_restrictions" name="dietary_restrictions">
            
            <label for="eating_habits">Eating Habits:</label>
            <input type="text" id="eating_habits" name="eating_habits">
            
            <label for="budget">Budget:</label>
            <input type="text" id="budget" name="budget">
            
            <input type="submit" value="Generate Menu">
        </form>
        
        {% if menu %}
        <div id="menu-section">
            <h2>Generated Menu:</h2>
            <div id="menu-container">
                {% for item in menu %}
                <p class="menu-item">{{ item }}</p>
                {% endfor %}
            </div>
        </div>
        {% endif %}
        
        <h2>Generate Random Recipe:</h2>
        <button class="button" onclick="fetchRandomRecipe()">Get Random Recipe</button>
        <p id="random-recipe" class="random-recipe"></p>

        <div id="rate-popup" class="popup">
            <h2>Rate Food Menu</h2>
            <label for="rating">Your Rating (1-5):</label>
            <input type="text" id="rating" name="rating">
            <input type="button" value="Submit" onclick="submitRating()">
            <input type="button" value="Close" class="close" onclick="closePopup()">
        </div>
    </div>

    <script>
        function fetchRandomRecipe() {
            fetch('/generate_random_recipe')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('random-recipe').innerText = data;
                })
                .catch(error => console.error('Error fetching random recipe:', error));
        }

        function showPopup() {
            document.getElementById('rate-popup').style.display = 'block';
        }

        function closePopup() {
            document.getElementById('rate-popup').style.display = 'none';
        }

        function submitRating() {
            const rating = document.getElementById('rating').value;
            // Submit the rating to the server (implement server-side logic)
            closePopup();
        }
    </script>
</body>
</html>
