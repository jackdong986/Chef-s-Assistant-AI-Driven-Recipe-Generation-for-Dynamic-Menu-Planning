<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: row;
        }

        .sidebar {
            width: 220px;
            background-color: #00509E;
            color: white;
            padding-top: 20px;
            position: fixed;
            top: 0;
            left: 0;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            height: 100%;
            z-index: 10;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 15px;
            display: block;
            font-size: 18px;
            border-bottom: 1px solid #003d7e;
            transition: background 0.3s ease;
        }

        .sidebar a:hover {
            background-color: #003d7e;
        }

        .sidebar a.active {
            background-color: #FFD500;
            color: #003d7e;
            font-weight: bold;
        }

        .content {
            margin-left: 240px;
            padding: 20px;
            width: 100%;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        h1 {
            color: #333;
        }

        input,
        button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .recipe-list {
            margin-top: 20px;
        }

        .menu-item {
            background-color: #f0f0f0;
            margin: 10px;
            padding: 15px;
            border-radius: 5px;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .loading img {
            width: 50px;
        }
    </style>
</head>

<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <a href="javascript:void(0);" onclick="showSection('searchSection')" class="active">Search Recipes</a>
        <a href="javascript:void(0);" onclick="showSection('randomSection')">Random Recipes</a>
        <a href="javascript:void(0);" onclick="showSection('createSection')">Create New Recipe</a>
    </div>

    <!-- Main Content -->
    <div class="content">
        <h1>Restaurant Menu Generator</h1>

        <!-- Search Section -->
        <div id="searchSection" class="section active">
            <h2>Search Recipes</h2>
            <input type="text" id="searchBar" placeholder="Search for a recipe...">
            <button onclick="searchRecipe()">Search</button>
            <div id="searchResults" class="recipe-list"></div>
        </div>

        <!-- Random Recipes Section -->
        <div id="randomSection" class="section">
            <h2>Generate Random Recipes</h2>
            <button onclick="fetchRandomRecipes()">Generate Random Recipes</button>
            <div id="randomRecipes" class="recipe-list"></div>
        </div>

        <!-- Create New Recipe Section -->
        <div id="createSection" class="section">
            <h2>Create a New Recipe</h2>
            <input type="text" id="newRecipeName" placeholder="Recipe Name">
            <button onclick="createRecipe()">Create Recipe</button>
            <div id="newRecipeDetails" class="recipe-list"></div>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="loading">
            <img src="https://i.gifer.com/ZZ5H.gif" alt="Loading..."> <!-- Example loading spinner -->
            <p>Processing...</p>
        </div>
    </div>

    <script>
        let isFetching = false; // Prevent multiple simultaneous fetches

        // Function to toggle the active section
        function showSection(sectionId) {
            // Hide all sections
            const sections = document.querySelectorAll('.section');
            sections.forEach(section => {
                section.classList.remove('active');
            });

            // Show the selected section
            const selectedSection = document.getElementById(sectionId);
            selectedSection.classList.add('active');

            // Highlight the active link in sidebar
            const links = document.querySelectorAll('.sidebar a');
            links.forEach(link => {
                link.classList.remove('active');
            });
            document.querySelector(`.sidebar a[onclick="showSection('${sectionId}')"]`).classList.add('active');
        }

        // Show loading indicator
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
        }

        // Hide loading indicator
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        // Function to search for recipes
        function searchRecipe() {
            if (isFetching) return; // Prevent triggering multiple fetches
            isFetching = true;

            const searchInput = document.getElementById('searchBar').value.trim();
            if (!searchInput) {
                alert("Please enter a recipe name to search.");
                isFetching = false;
                return;
            }

            showLoading(); // Show loading spinner while fetching data

            fetch('/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: searchInput })
            })
            .then(response => response.json())
            .then(data => {
                const searchResults = document.getElementById('searchResults');
                searchResults.innerHTML = data.recipes.map(recipe => `
                    <div class="menu-item">
                        <h3>${recipe.name}</h3>
                        <p><strong>Similarity:</strong> ${recipe.similarity}</p>
                    </div>
                `).join('');
                hideLoading(); // Hide loading spinner after data is fetched
                isFetching = false;
            })
            .catch(error => {
                console.error("Error fetching search results:", error);
                hideLoading();
                isFetching = false;
            });
        }

        // Function to fetch random recipes
        function fetchRandomRecipes() {
            fetch('/random')
            .then(response => response.json())
            .then(data => {
                const randomRecipes = document.getElementById('randomRecipes');
                randomRecipes.innerHTML = data.map(recipe => `
                    <div class="menu-item">
                        <h3>${recipe.name}</h3>
                        <p><strong>Ingredients:</strong> ${recipe.ingredients}</p>
                    </div>
                `).join('');
            });
        }

        // Function to create a new recipe
        function createRecipe() {
            const newRecipeName = document.getElementById('newRecipeName').value.trim();
            if (!newRecipeName) {
                alert("Please enter a recipe name to create.");
                return;
            }

            fetch('/create_recipe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: newRecipeName })
            })
            .then(response => response.json())
            .then(data => {
                const newRecipeDetails = document.getElementById('newRecipeDetails');
                newRecipeDetails.innerHTML = `
                    <div class="menu-item">
                        <h3>${data.name}</h3>
                        <p><strong>Ingredients:</strong> ${data.ingredients}</p>
                        <p><strong>Description:</strong> ${data.description}</p>
                    </div>
                `;
            });
        }

        // Function to format and display ingredients
        function formatIngredients(ingredients) {
            return ingredients.join(', '); // Join ingredients into a comma-separated string
        }

        // Show the initial section (Search Recipes)QA
        showSection('searchSection');
    </script>
</body>

</html>
