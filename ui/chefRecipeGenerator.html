<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chef Recipe Generator</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            padding: 20px;
            color: #003d7e;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #003d7e;
            margin-bottom: 20px;
        }

        button {
            margin: 10px;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            background-color: #FFD500;
            color: #003d7e;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            width: 100%;
        }

        button:hover {
            background-color: #e5be00;
        }

        .recipe-list,
        .recipe-steps {
            background-color: #003d7e;
            color: #ffffff;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        #searchBar {
            padding: 12px;
            width: calc(100% - 24px);
            font-size: 16px;
            border: 1px solid #FFD500;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        #loadingIndicator {
            text-align: center;
            color: #FFD500;
            font-size: 18px;
            margin-top: 10px;
        }

        #ingredientsList {
            margin-top: 20px;
        }

        @media (min-width: 600px) {
            #searchResults {
                display: flex;
                flex-wrap: wrap;
            }

            #searchResults button {
                flex: 1 1 calc(33% - 20px);
                margin: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Chef Recipe Generator</h2>
        <input type="text" id="searchBar" placeholder="Search for a recipe..." oninput="filterRecipes()" />
        <button onclick="searchRecipe()">Search Recipe</button>
        <button onclick="generateRandomRecipe()">Generate Random Recipe</button>

        <!-- Recipe List Section -->
        <div id="searchResults" class="recipe-list" style="display: none;">
            <h3>Recipes</h3>
            <div id="similarRecipesList"></div>
        </div>

        <!-- Recipe Details Section -->
        <div id="recipeDetails" class="recipe-steps" style="display: none;">
            <h3 id="recipeName">Recipe Name</h3>
            <h4>Ingredients:</h4>
            <ul id="recipeIngredientsList"></ul>
            <h4>Steps:</h4>
            <ol id="recipeStepsList"></ol>
        </div>

        <div id="loadingIndicator" style="display: none;">Loading...</div>
    </div>

    <script>
        function generateRandomRecipe() {
            showLoading();
            fetch('/random')
                .then(response => response.json())
                .then(data => {
                    hideLoading();
                    displayRecipes(data, false);
                });
        }

        function searchRecipe() {
            const searchInput = document.getElementById('searchBar').value.trim();

            if (!searchInput) {
                alert("Please enter a recipe name to search.");
                return;
            }

            if (/^\d+$/.test(searchInput)) {
                alert("Recipe name cannot be a number. Please enter a valid name.");
                return;
            }

            showLoading();

            fetch('/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: searchInput })
            })
                .then(response => response.json())
                .then(data => {
                    hideLoading();
                    displayRecipes(data.recipes, true);
                })
                .catch(error => {
                    hideLoading();
                    alert("An error occurred while searching. Please try again.");
                });
        }



        function displayRecipes(recipes, isSearch) {
            const recipeList = document.getElementById('similarRecipesList');
            recipeList.innerHTML = recipes
                .map(recipe =>
                    `<button onclick="viewRecipeDetails('${recipe.name || recipe}')">${recipe.name || recipe}</button>`
                )
                .join('');
            document.getElementById('searchResults').style.display = 'block';
            document.getElementById('recipeDetails').style.display = 'none';
        }

        function viewRecipeDetails(name) {
            showLoading();
            fetch(`/recipe_details?name=${encodeURIComponent(name)}`)
                .then(response => response.json())
                .then(data => {
                    hideLoading();
                    document.getElementById('recipeName').textContent = data.name;
                    document.getElementById('recipeIngredientsList').innerHTML = data.ingredients
                        .map(ingredient => `<li>${ingredient}</li>`)
                        .join('');
                    document.getElementById('recipeStepsList').innerHTML = data.steps
                        .map(step => `<li>${step}</li>`)
                        .join('');
                    document.getElementById('recipeDetails').style.display = 'block';
                    document.getElementById('searchResults').style.display = 'none';
                });
        }

        function showLoading() {
            document.getElementById('loadingIndicator').style.display = 'block';
        }

        function hideLoading() {
            document.getElementById('loadingIndicator').style.display = 'none';
        }

        function filterRecipes() {
            const input = document.getElementById('searchBar').value.toLowerCase();
            const buttons = document.querySelectorAll('#similarRecipesList button');
            buttons.forEach(button => {
                button.style.display = button.textContent.toLowerCase().includes(input) ? '' : 'none';
            });
        }
    </script>

</body>

</html>
