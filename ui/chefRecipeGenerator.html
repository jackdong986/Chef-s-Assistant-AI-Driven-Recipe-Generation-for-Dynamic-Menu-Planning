<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chef Recipe Flow</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            padding: 20px;
            color: #343a40;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #007bff;
            margin-bottom: 20px;
        }

        button {
            margin: 10px;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            background-color: #28a745;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            width: 100%;
        }

        button:hover {
            background-color: #218838;
        }

        .recipe-list, .recipe-steps {
            background-color: #e9ecef;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            color: #333333;
        }

        #searchBar {
            padding: 12px;
            width: calc(100% - 24px);
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        @media (min-width: 600px) {
            #searchResults {
                display: flex;
                flex-wrap: wrap;
            }
            #searchResults button {
                flex: 1 1 calc(33% - 20px);
                margin: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Chef Recipe Generator</h2>

        <input type="text" id="searchBar" placeholder="Search for a recipe..." oninput="filterRecipes()" />
        <button onclick="searchRecipe()">Search Recipe</button>
        <button onclick="generateRandomRecipe()">Generate Random Recipe</button>

        <div id="randomRecipe" class="recipe-steps" style="display: none;">
            <h3>Random Recipe</h3>
            <p id="randomRecipeName">Recipe Name</p>
            <p><strong>Steps:</strong></p>
            <p id="randomRecipeSteps">1. Step one...<br>2. Step two...</p>
        </div>

        <div id="searchResults" class="recipe-list" style="display: none;">
            <h3>Similar Recipes</h3>
            <div id="similarRecipesList">
                <!-- Similar recipes  -->
            </div>
        </div>

        <div id="generatedSteps" class="recipe-steps" style="display: none;">
            <h3>Generated Recipe Steps</h3>
            <p id="generatedRecipeSteps">Generated steps will appear here...</p>
        </div>
    </div>

    <script>
        function generateRandomRecipe() {
            fetch('/random')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('randomRecipeName').textContent = data.name;
                    document.getElementById('randomRecipeSteps').textContent = data.steps;
                    document.getElementById('randomRecipe').style.display = 'block';
                    document.getElementById('searchResults').style.display = 'none';
                    document.getElementById('generatedSteps').style.display = 'none';
                });
        }

        function searchRecipe() {
            const searchInput = document.getElementById('searchBar').value;
            fetch('/generate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ prompt: searchInput }),
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('generatedRecipeSteps').textContent = data.generated_steps;
                const similarRecipes = data.similar_recipes.map(recipe => `<button>${recipe[0]}</button>`).join('');
                document.getElementById('similarRecipesList').innerHTML = similarRecipes;

                document.getElementById('searchResults').style.display = 'block';
                document.getElementById('generatedSteps').style.display = 'block';
                document.getElementById('randomRecipe').style.display = 'none';
            });
        }

        function filterRecipes() {
            const input = document.getElementById('searchBar').value.toLowerCase();
            const buttons = document.querySelectorAll('#similarRecipesList button');
            buttons.forEach(button => {
                if (button.textContent.toLowerCase().includes(input)) {
                    button.style.display = '';
                } else {
                    button.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
