<!-- templates/index.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Menu Generator</title>
</head>
<body>
    <h1>Restaurant Menu Generator</h1>
    <form method="post">
        <label for="prompt">Enter your prompt:</label><br>
        <input type="text" id="prompt" name="prompt" value="{{ prompt }}"><br><br>
        <input type="submit" value="Generate Menu">
    </form>
    <h2>Generated Menu:</h2>
    <p>{{ menu }}</p>
</body>
</html>
